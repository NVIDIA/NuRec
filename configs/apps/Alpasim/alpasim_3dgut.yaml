# order in which configs override each other (/* - denotes a relative search path)
defaults:
  - /apps/AV/NV/3dgut_dynamic.yaml
  - _alpasim_mixin

# overwrite some of the default parameters
loss: 
  lidar:
    lambda_: 0.03

dataset:
  n_train_sample_lidar_rays: 2048

checkpoint:
  every_n_train_steps: ${mul:${trainer.max_epochs},${dataset.n_samples_per_epoch}}
