# Default Car2Sim variant tuned for lidar-quality evaluation.
# Adds intensity + raydrop rendering, weighted lidar/intensity/raydrop
# losses, and lidar test-time point-cloud filtering.

defaults:
  - /apps/prod/Hyperion-8.1/car2sim
  - /apps/prod/Hyperion-8.1/options/lidar_rendering: intensity_raydrop
  - /apps/prod/Hyperion-8.1/options/lidar_attribute_loss_weights: intensity_1_raydrop_1e-1
  - /apps/prod/Hyperion-8.1/options/lidar_return_filter: raydrop_threshold_65e-2
  - /apps/prod/Hyperion-8.1/options/lidar_point_cloud_filter: distance_error_2e-2
  - override /apps/prod/Hyperion-8.1/options/lidar_loss_weight: "5e-2"
  # Keep the camera-side win of the mask that car2sim_6cam selects, but drop its lidar
  # crop: under valid_camera_lidar_overlap the lidar tiles that map to no active camera
  # tile are stamped INVALID and drop out of the lidar losses, which is counter to this
  # preset's purpose (lidar-quality evaluation). camera_invalid_only still skips
  # fully-INVALID camera tiles while lidar supervision stays uncropped.
  - override /apps/prod/Hyperion-8.1/options/active_tile_mask: camera_invalid_only
