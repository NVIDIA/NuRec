# Skip fully-INVALID camera tiles only; lidar rendering and supervision stay uncropped.
# Changes no supervision terms, so it needs no loss-weight compensation.

model:
  renderer:
    active_tile_mask:
      enabled: true
      strategy: camera_invalid_only
