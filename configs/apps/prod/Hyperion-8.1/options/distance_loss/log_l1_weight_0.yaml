# Configure log-L1 predicted-depth supervision with zero training weight.

loss:
  distance:
    fn: log_l1
    reduce:
      name: mean
    lambda_: 0.0
    min_distance: 0.01
    max_distance: 50.0
    allow_missing_supervision: true
    normalize_by_opacity: false
    mask_semantic_classes: ["~sky", "road"]
    semantic_lambdas: [1.0, 2.0]
