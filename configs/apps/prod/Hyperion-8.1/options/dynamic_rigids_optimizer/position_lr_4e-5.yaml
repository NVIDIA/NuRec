# Dynamic-rigid optimizer using position LR 4e-5.
#
# The full optimizer list is one atomic option because OmegaConf replaces
# optimizer lists instead of merging individual parameter entries.

model:
  layers:
    dynamic_rigids:
      optimizers:
        - name: fused_adam
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            positions:
              args:
                lr: 4e-5
          scheduler:
            name: ExponentialLR
            interval: step
            args:
              gamma: ${calc_exp_lr_decay_rate:0.01,${mul:${trainer.max_epochs},${dataset.n_samples_per_epoch}}}
        - name: fused_adam
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            densities:
              args:
                lr: 0.05
            features_albedo:
              args:
                lr: 0.0025
            features_specular:
              args:
                lr: ${div:0.0025,20}
            rotations:
              args:
                lr: 0.001
            scales:
              args:
                lr: 0.005
            extra_signal:
              args:
                lr: 0.01
            camera_extra_signal:
              args:
                lr: 0.01
            lidar_extra_signal:
              args:
                lr: 0.01
