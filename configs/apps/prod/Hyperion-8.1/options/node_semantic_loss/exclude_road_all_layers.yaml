# Exclude road semantics from every Gaussian layer supervised by the node-semantic loss.

loss:
  node_semantic_gaussians:
    layer_labels_to_exclude:
      background: [road]
      dynamic_rigids: [road]
      dynamic_deformables: [road]
      static_rigids: [road]
      traffic_light: [road]
