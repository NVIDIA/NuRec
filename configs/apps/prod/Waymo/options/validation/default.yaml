defaults:
  # Match training's subsampling to avoid aliasing; a higher factor can speed validation.
  - override /image_resolution/camera@_global_.dataset.n_val_image_resolution: relative_2


dataset:
  val_camera_frame_step: 1  # Validation on every camera frame (10 fps camera -> 10 fps predictions)
  val_lidar_frame_step: 1

system:
  test:
    save_results: true
    save_inputs: true
    save_videos: true
    video_fps: 10
