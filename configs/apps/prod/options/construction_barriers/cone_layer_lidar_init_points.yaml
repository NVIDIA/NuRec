# Measured cone initialization points in a standard static SH layer.
defaults:
  - /model/gaussians/models@model.layers.cones: sh_gaussians
  - /model/gaussians/initialization@model.layers.cones.initialization: lidar_construction
  - _self_

dataset:
  aux_data: true
  cuboid_tracks_params:
    # Cones are reconstructed in the dedicated static layer, so exclude them
    # from ordinary cuboid-track assembly.
    excluded_class_names: [cone]

model:
  layers:
    cones:
      # Match the active preset's signals, including intensity/raydrop when present.
      extra_signal: ${model.layers.background.extra_signal}
      fourier_features_dim: 1
      scale_pos_lr_by_scene_extent: false
      # OmegaConf replaces lists atomically. Keep the native SH optimizers,
      # changing only position LR to 0.00016 * 10, with no scene-scale factor.
      optimizers:
        - name: ${model.gaussian_optimizer_name}
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            positions:
              args:
                lr: 0.0016
          scheduler:
            name: ExponentialLR
            interval: step
            args:
              gamma: ${calc_exp_lr_decay_rate:0.01,${mul:${trainer.max_epochs},${dataset.n_samples_per_epoch}}}
        - name: ${model.gaussian_density_optimizer_name}
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            densities:
              args:
                lr: 0.05
        - name: ${model.gaussian_scale_optimizer_name}
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            scales:
              args:
                lr: 0.005
        - name: ${model.gaussian_optimizer_name}
          args:
            lr: 0.01
            eps: 1.e-15
            betas: [0.9, 0.99]
          params:
            features_albedo:
              args:
                lr: 0.0025
            features_specular:
              args:
                lr: ${div:0.0025,20}
            rotations:
              args:
                lr: 0.001
            extra_signal:
              args:
                lr: 0.01
            camera_extra_signal:
              args:
                lr: 0.01
            lidar_extra_signal:
              args:
                lr: 0.01
