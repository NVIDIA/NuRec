#
# Component-only overlay: train the background + dynamic_deformables
# Gaussian layers; everything else disabled by omission.
#
# Loss mask = residual (background) ∪ expanded deformable boxes; sky
# and the disabled siblings' regions are carved out.
#
# Compose example:
#
#     defaults:
#       - /apps/prod/Hyperion-8.1/car2sim
#       - /component_only: background_layer_and_deformables_only

component_only:
  # ``enabled: true`` switches this run into opt-in mode: only the
  # components listed below are trained; every other component (unlisted,
  # or ``state: disabled``) is turned off. Enabling every component
  # collapses back to the parent app config's full training.
  enabled: true
  layers:
    background:
      state: enabled
    dynamic_deformables:
      state: enabled
