syntax = "proto3";

package nurec.grpc.protos.rdma;

////////////////////////////////////////////////////////////////////////////////
// RDMA session control plane
//
// Establishes a one-sided RDMA WRITE data path between a client and the server.
// The gRPC control plane exchanges QP parameters and buffer registrations;
// rendered frames are then delivered out-of-band via RDMA WRITE into
// client-registered buffers, and the render RPC's response carries only
// metadata (bytes_written, format, buffer_id).
////////////////////////////////////////////////////////////////////////////////

// Client sends its QP info; server responds with its own.
// Both sides independently transition their QPs to RTS after this exchange.
message OpenRdmaSessionRequest {
    bytes  gid          = 1;   // 16-byte RoCE GID
    uint32 gid_index    = 2;   // GID table index on the client NIC (informational: the server addresses it by gid)
    uint32 qp_num       = 3;
    uint32 psn          = 4;   // initial packet sequence number (24-bit)
    uint64 max_buf_size = 5;
}

message OpenRdmaSessionResponse {
    string session_id = 1;
    bytes  gid        = 2;
    uint32 gid_index  = 3;
    uint32 qp_num     = 4;
    uint32 psn        = 5;
}

// Client registers a cudaMalloc'd (or host-pinned), ibv_reg_mr'd buffer as an
// RDMA WRITE destination on the server.
message RegisterReceiveBufferRequest {
    string session_id  = 1;
    uint64 remote_addr = 2;   // VA of the registered buffer on the client
    uint32 rkey        = 3;   // remote key granting REMOTE_WRITE access
    uint64 buffer_size = 4;
    uint32 buffer_id   = 5;   // client-assigned slot identifier
}

message RegisterReceiveBufferResponse {
    bool   success       = 1;
    string error_message = 2;
}

message CloseRdmaSessionRequest {
    string session_id = 1;
}

message CloseRdmaSessionResponse {
    bool   success       = 1;
    string error_message = 2;
}
