seed: 0
mode: train
resume: null
resume_weights_only: false
verbose: false
out_dir: .

logger:
  name: dummy

checkpoint:
  every_n_train_steps: null
  save_top_k: 1
  monitor: null
  mode: min
  save_on_train_epoch_end: false
  artifact: {}

harmonizer: {}

loss: null

trainer:
  max_epochs: 1
  check_val_every_n_epoch: 1
  precision: "32"
  log_every_n_steps: 1
  enable_progress_bar: false
  num_sanity_val_steps: 0

dataset:
  name: ncore
  path: /does/not/matter
  n_samples_per_epoch: 1
  n_train_sample_camera_rays: 1
  n_val_image_subsample: 1
  n_train_sequential_image_subsample: 1
  aux_data: false
  seek_offset_sec: null
  duration_sec: null
  camera_ids: []
  lidar_ids: []
  train_camera_ids: []
  train_lidar_ids: []
  val_camera_ids: []
  val_lidar_ids: []
  max_dist_m: 100.0
  val_sensor_transl_delta_m: null
  val_sensor_rot_delta_deg: null
  open_consolidated: false
  cuboid_tracks_params: {}
  valid_measurements_method: EGO
  valid_lidarpoints_cuboid_track_params:
    track_padding_m: [0.0, 0.0, 0.0]
  valid_pixels_cuboid_track_params:
    track_padding_m: [0.0, 0.0, 0.0]
    frame_track_idxs: false
  valid_pixels_scene_flow_params:
    flow_min_speed_ms: 0.0
    flow_dilate_radius: 0
    flow_downsample_scale: 1
  valid_pixels_traffic_light_params: {}
  valid_pixels_frame_mask_params: {}
  lidar_dynamic_points: {}
  camera_point_cloud_ignore_classes: []
  camera_point_cloud_dynamic_classes: []

datamodule:
  name: so
  update_n_epochs: 1
  train_num_workers: 0
  train_batch_size: 1
  val_num_workers: 0
  test_num_workers: 0
  mock_dataloader: true
  prefetch:
    enabled: false
    queue_size: 0

sensor:
  lidar_models:
    spinning: {}

system:
  name: gaussians-system
  save_logger: false
  warmup_steps: 0
  record_timings: {train_interval: 1, val_interval: 1}
  record_quality_metrics: {psnr_interval: 1}
  test:
    video_fps: 1
    track_ply: null
    track_orbit: null
    track_rotation: null
    background_removal: null
    val_render_selected_nodes: null
    metrics: null
    lidar:
      raydrop_threshold: 0.0
      ROI: null

model:
  name: gaussians-composite
  train_num_rays: 1

  calib:
    name: free-pose-calib
    lidar: {enabled: true}
    camera: {enabled: true}

  background:
    name: skip-background

  renderer:
    name: 3dgs-gsplat

  strategy:
    name: mcmc
    exclude_layer_ids: []

  post_processing:
    main:
      name: ppisp-post-processing-legacy

  layers:
    background:
      name: sh-gaussians
      density_activation: sigmoid
      scale_activation: exp
      rotation_activation: normalize
      fourier_features_dim: 1
      progressive_training: {}
      particle: {}
      initialization: {name: test-init}
      tracks:
        is_standalone: true

    dynamic_rigids:
      name: rigid-gaussians
      density_activation: sigmoid
      scale_activation: exp
      rotation_activation: normalize
      fourier_features_dim: 1
      progressive_training: {}
      particle: {}
      initialization: {name: test-init}
      optimize_track_albedo: false
      optimize_track_scale: false
      track_albedo: {}
      track_scale: {}
      motion_source_layer: null
      tracks:
        label_classes: ["automobile"]
        is_dynamic: true

    dynamic_deformables:
      name: deformable-gaussians
      density_activation: sigmoid
      scale_activation: exp
      rotation_activation: normalize
      fourier_features_dim: 1
      progressive_training: {}
      particle: {}
      initialization: {name: test-init}
      optimize_track_albedo: false
      optimize_track_scale: false
      track_albedo: {}
      track_scale: {}
      motion_source_layer: null
      deform_network: {}
      deformnet_start_iteration: 1000
      cuboid_tracks_expand: 0.5
      smoothness_frame_steps: 5
      tracks:
        label_classes: ["pedestrian"]
        is_dynamic: true
