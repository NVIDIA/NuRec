name: nurec-onboard
description: NuRec Onboard workflow to build an NCore converter, validate, and reconstruct autonomously. Use to onboard a raw dataset end-to-end from an input YAML.
requires_docker: true
requires_gpu: true
requires_bazel: true
agents:
  - claude
  - codex
prompt: |
  Read the skill file at {{skill}} and follow its instructions completely.
  This is a workflow orchestrator -- it chains three core steps autonomously,
  preceded by a conditional `audit-dataset` pre-check that runs automatically
  when the input lacks `data.profile` (up to four steps total).
  Do not ask the user for input at any point.

  Input:
  {{input}}
