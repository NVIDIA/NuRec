      ratio_lidar_samples: 1.0
      update_n_epochs: 0
      camera_sensor_sampler:
        name: coverage
        sample_all_sensors: false
      camera_frame_sampler:
        name: coverage
      camera_pixel_sampler:
        name: image-crop
        crop_type: full_image
        subsample: 2
        roi_lt: null
        roi_rb: null
        crop_ratio: null
      lidar_sensor_sampler:
        name: coverage
        sample_all_sensors: false
      lidar_frame_sampler:
        name: coverage
      lidar_point_sampler:
        name: lidar-crop
        subsample: 1
  path: ???
  seek_offset_sec: null
  duration_sec: null
  camera_ids:
  - camera_front_wide_120fov
  - camera_front_tele_30fov
  - camera_cross_right_120fov
  - camera_cross_left_120fov
  - camera_rear_left_70fov
  - camera_rear_right_70fov
  - camera_rear_tele_30fov
  lidar_ids:
  - lidar_top_360fov
  train_camera_ids:
  - camera_front_wide_120fov
  - camera_front_tele_30fov
  - camera_cross_right_120fov
  - camera_cross_left_120fov
  - camera_rear_left_70fov
  - camera_rear_right_70fov
  - camera_rear_tele_30fov
  train_lidar_ids:
  - lidar_top_360fov
  val_camera_ids:
  - camera_front_wide_120fov
  - camera_front_tele_30fov
  - camera_cross_right_120fov
  - camera_cross_left_120fov
  - camera_rear_left_70fov
  - camera_rear_right_70fov
  - camera_rear_tele_30fov
  val_lidar_ids:
