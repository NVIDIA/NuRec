# The AV Benchmark training preset. Captured from a run of this workflow, then reduced to the
# values that differ from the schema defaults, so what is written here is what the benchmark
# chose rather than what NuRecConfig already says. The lidar models are in sensor/;
# out_dir and dataset.path are declared missing because the spec supplies them every run.
defaults:
- sensor/hyperion8_1_lidar
- _self_
seed: 42
mode: train
resume: null
resume_weights_only: false
verbose: false
out_dir: ???
logger:
  enabled: false
  run_id: av_benchmark
  name: dummy
checkpoint:
  every_n_train_steps: 30000
  save_top_k: 1
  monitor: train/psnr
  mode: max
  save_on_train_epoch_end: true
  artifact:
    enabled: true
harmonizer:
  training:
    enabled: false
  inference:
    enabled: false
prober:
  batch_limit: 0
scopedtimer:
  profiling_backend: NVTX
trainer:
  device_count: 1
  max_epochs: 1
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  enable_progress_bar: true
  num_sanity_val_steps: 0
  plugins: []
  precision: 32
dataset:
  n_samples_per_epoch: 500
  n_train_sample_camera_rays: 6144
  n_val_image_subsample: 2
  n_train_sequential_image_subsample: 4
  aux_data: true
  name: ncore
  samplers:
